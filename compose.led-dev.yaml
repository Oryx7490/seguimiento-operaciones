# Entorno aislado para implementar el diseñador LED sin tocar seguimiento local.
services:
  postgres:
    ports: !override
      - "127.0.0.1:15433:5432"
    volumes: !override
      - led_designer_dev_postgres:/var/lib/postgresql/data

  minio:
    ports: !override
      - "127.0.0.1:19010:9000"
      - "127.0.0.1:19011:9001"
    volumes: !override
      - led_designer_dev_minio:/data

  web:
    environment:
      APP_BASE_URL: http://100.68.83.67:18080
    ports: !override
      - "100.68.83.67:18080:3000"
    volumes: !override
      - ./web:/app
      - led_designer_dev_web_node_modules:/app/node_modules
      - led_designer_dev_web_next:/app/.next

  designer-engine:
    volumes: !override
      - ./designer-engine:/app

  worker:
    volumes: !override
      - ./worker:/app
      - led_designer_dev_worker_node_modules:/app/node_modules

  mailpit:
    ports: !override
      - "127.0.0.1:18025:8025"
      - "127.0.0.1:1125:1025"

volumes:
  led_designer_dev_postgres:
  led_designer_dev_minio:
  led_designer_dev_web_node_modules:
  led_designer_dev_web_next:
  led_designer_dev_worker_node_modules:
