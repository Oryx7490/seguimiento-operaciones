# seguimiento-operaciones — entorno local (migrable a VPS)
# Servicios: web (Next.js), worker (tareas programadas), postgres, minio (S3), reverse-proxy.
# Todos los puertos se exponen en 127.0.0.1 para uso local.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Define S3_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Define S3_SECRET_KEY en .env}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET};
      exit 0;
      "
    restart: "no"

  web:
    build:
      context: ./web
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      MINIO_ENDPOINT: minio:9000
      S3_FORCE_PATH_STYLE: "true"
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Mexico_City}
    # Producción (next start). next dev+Turbopack (16.3.5) no hidrata componentes
    # cliente y next build falla con NODE_ENV != production; por eso build+start.
    command: ["sh", "-lc", "npm run build && exec npm start"]
    ports:
      - "127.0.0.1:8080:3000"
      - "${TAILSCALE_IP:-127.0.0.1}:8080:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      MINIO_ENDPOINT: minio:9000
      S3_FORCE_PATH_STYLE: "true"
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Mexico_City}
    volumes:
      - ./worker:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next:
  worker_node_modules: