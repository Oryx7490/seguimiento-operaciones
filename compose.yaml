# seguimiento-operaciones — entorno local (migrable a VPS)
# Servicios: web (Next.js), worker (tareas programadas), postgres, minio (S3), reverse-proxy.
# Todos los puertos se exponen en 127.0.0.1 para uso local.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: ${DEFAULT_TIMEZONE:-America/Mexico_City}
      PGTZ: ${DEFAULT_TIMEZONE:-America/Mexico_City}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Define S3_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Define S3_SECRET_KEY en .env}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET};
      mc mb --ignore-existing local/whatsapp-media;
      mc mb --ignore-existing local/${WHATSAPP_BACKUP_BUCKET:-whatsapp-backups};
      exit 0;
      "
    restart: "no"

  web:
    build:
      context: ./web
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      WHATSAPP_BACKUP_BUCKET: ${WHATSAPP_BACKUP_BUCKET:-whatsapp-backups}
      MINIO_ENDPOINT: minio:9000
      S3_FORCE_PATH_STYLE: "true"
      SESSION_SECRET: ${SESSION_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      TZ: ${DEFAULT_TIMEZONE:-America/Mexico_City}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Mexico_City}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Seguimiento Ops <seguimiento@localhost>}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      FACE_SERVICE_URL: http://face-service:8000
      FACE_SFACE_THRESHOLD: ${FACE_SFACE_THRESHOLD:-0.363}
      FACE_SFACE_MARGIN: ${FACE_SFACE_MARGIN:-0.05}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-frob/qwen3.5-instruct:9b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Producción (next start). next dev+Turbopack (16.3.5) no hidrata componentes
    # cliente y next build falla con NODE_ENV != production; por eso build+start.
    command: ["sh", "-lc", "npm run build && exec npm start"]
    ports:
      - "127.0.0.1:8080:3000"
      - "${TAILSCALE_IP:-127.0.0.1}:8080:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      MINIO_ENDPOINT: minio:9000
      S3_FORCE_PATH_STYLE: "true"
      TZ: ${DEFAULT_TIMEZONE:-America/Mexico_City}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Mexico_City}
      WORKER_TOKEN: ${WORKER_TOKEN}
      WEB_INTERNAL_URL: http://web:3000
      FACE_SERVICE_URL: http://face-service:8000
      FACE_SCAN_INTERVAL_MS: ${FACE_SCAN_INTERVAL_MS:-900000}
      FACE_TRAIN_INTERVAL_MS: ${FACE_TRAIN_INTERVAL_MS:-86400000}
      FACE_SCAN_ENABLED: ${FACE_SCAN_ENABLED:-true}
      FACE_SFACE_ENABLED: ${FACE_SFACE_ENABLED:-true}
      FACE_SFACE_BATCH_SIZE: ${FACE_SFACE_BATCH_SIZE:-250}
      FACE_SFACE_THRESHOLD: ${FACE_SFACE_THRESHOLD:-0.363}
      FACE_SFACE_MARGIN: ${FACE_SFACE_MARGIN:-0.05}
      EXPENSE_PHOTO_SCAN_ENABLED: ${EXPENSE_PHOTO_SCAN_ENABLED:-true}
      EXPENSE_PHOTO_SCAN_HOUR: ${EXPENSE_PHOTO_SCAN_HOUR:-1}
    volumes:
      - ./worker:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      web:
        condition: service_started
      face-service:
        condition: service_healthy
    restart: unless-stopped

  face-service:
    build:
      context: ./face-service
    environment:
      TZ: ${DEFAULT_TIMEZONE:-America/Mexico_City}
      INSIGHTFACE_HOME: /models
      FACE_DET_SIZE: "640"
      FACE_MIN_SCORE: "0.5"
      FACE_MODEL_PACK: buffalo_l
      FACE_SFACE_ENABLED: ${FACE_SFACE_ENABLED:-true}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "${TAILSCALE_IP:-127.0.0.1}:8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next:
  worker_node_modules:
